name: Daily digest

on:
  schedule:
    - cron: "30 0 * * *"   # UTC 00:30 = 北京时间 08:30
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch today's articles
        run: python pipeline/build.py

      - name: Commit data
        run: |
          git config user.name "meridian-bot"
          git config user.email "meridian-bot@users.noreply.github.com"
          git add data/articles.json data/articles.js
          git diff --cached --quiet || git commit -m "data: daily articles $(date -u +%F)"
          git push
